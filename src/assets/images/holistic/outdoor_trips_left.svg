<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="100%" height="100%">
  <defs>
    <linearGradient id="bg_ot1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="100%" stop-color="#F0F6FE"/>
    </linearGradient>
    <linearGradient id="blue_ot1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0B43BD"/>
      <stop offset="100%" stop-color="#061D52"/>
    </linearGradient>
    <linearGradient id="gold_ot1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FCD34D"/>
      <stop offset="50%" stop-color="#D4AF37"/>
      <stop offset="100%" stop-color="#B45309"/>
    </linearGradient>
    <linearGradient id="cyan_ot1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8"/>
      <stop offset="100%" stop-color="#0284C7"/>
    </linearGradient>
    <filter id="sh_ot1" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#0B43BD" flood-opacity="0.16"/>
    </filter>
  </defs>
  <rect width="500" height="500" rx="36" fill="url(#bg_ot1)" stroke="rgba(11,67,189,0.08)" stroke-width="2"/>
  <circle cx="250" cy="210" r="165" fill="none" stroke="url(#gold_ot1)" stroke-width="2.5" stroke-dasharray="8 6" opacity="0.45"/>
  <circle cx="250" cy="210" r="145" fill="none" stroke="url(#blue_ot1)" stroke-width="1.5" opacity="0.25"/>
  
    <g filter="url(#sh_ot1)">
      <!-- Mountain Peaks -->
      <polygon points="120,280 220,130 310,280" fill="url(#blue_ot1)"/>
      <polygon points="220,130 200,165 220,175 235,160 250,175 220,130" fill="#FFFFFF"/>
      <polygon points="230,280 320,150 400,280" fill="url(#cyan_ot1)"/>
      <polygon points="320,150 305,175 320,185 340,170 320,150" fill="#FFFFFF"/>
      <!-- Sun -->
      <circle cx="160" cy="120" r="32" fill="url(#gold_ot1)"/>
      <!-- Compass / Adventure Badge -->
      <circle cx="250" cy="270" r="45" fill="#FFFFFF" stroke="url(#gold_ot1)" stroke-width="4"/>
      <circle cx="250" cy="270" r="36" fill="url(#blue_ot1)"/>
      <!-- Compass Needle -->
      <polygon points="250,240 257,270 250,264" fill="url(#gold_ot1)"/>
      <polygon points="250,300 257,270 250,264" fill="#FFFFFF"/>
      <polygon points="250,240 243,270 250,264" fill="#E2E8F0"/>
      <polygon points="250,300 243,270 250,264" fill="url(#cyan_ot1)"/>
      <circle cx="250" cy="270" r="4" fill="#FFFFFF"/>
    </g>
  
  <g transform="translate(250, 440)">
    <path d="M-170 -18 L170 -18 L155 18 L-155 18 Z" fill="url(#blue_ot1)" filter="url(#sh_ot1)"/>
    <rect x="-150" y="-14" width="300" height="28" rx="6" fill="none" stroke="url(#gold_ot1)" stroke-width="1.5"/>
    <text x="0" y="5" fill="#FFFFFF" font-family="sans-serif" font-size="12" font-weight="800" letter-spacing="1.5" text-anchor="middle">OUTDOOR EXPEDITIONS</text>
  </g>
</svg>