<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="100%" height="100%">
  <defs>
    <linearGradient id="bg_pd1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="100%" stop-color="#F0F6FE"/>
    </linearGradient>
    <linearGradient id="blue_pd1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0B43BD"/>
      <stop offset="100%" stop-color="#061D52"/>
    </linearGradient>
    <linearGradient id="gold_pd1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FCD34D"/>
      <stop offset="50%" stop-color="#D4AF37"/>
      <stop offset="100%" stop-color="#B45309"/>
    </linearGradient>
    <linearGradient id="cyan_pd1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8"/>
      <stop offset="100%" stop-color="#0284C7"/>
    </linearGradient>
    <filter id="sh_pd1" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#0B43BD" flood-opacity="0.16"/>
    </filter>
  </defs>
  <rect width="500" height="500" rx="36" fill="url(#bg_pd1)" stroke="rgba(11,67,189,0.08)" stroke-width="2"/>
  <circle cx="250" cy="210" r="165" fill="none" stroke="url(#gold_pd1)" stroke-width="2.5" stroke-dasharray="8 6" opacity="0.45"/>
  <circle cx="250" cy="210" r="145" fill="none" stroke="url(#blue_pd1)" stroke-width="1.5" opacity="0.25"/>
  
    <g filter="url(#sh_pd1)">
      <!-- Big Dynamic Athletics Ring -->
      <circle cx="250" cy="205" r="115" fill="none" stroke="url(#blue_pd1)" stroke-width="12"/>
      <circle cx="250" cy="205" r="95" fill="#FFFFFF"/>
      <!-- Football / Soccer Pattern -->
      <circle cx="250" cy="205" r="70" fill="#FFFFFF" stroke="url(#blue_pd1)" stroke-width="3"/>
      <polygon points="250,175 275,193 265,223 235,223 225,193" fill="url(#blue_pd1)"/>
      <line x1="250" y1="175" x2="250" y2="140" stroke="url(#blue_pd1)" stroke-width="3"/>
      <line x1="275" y1="193" x2="308" y2="180" stroke="url(#blue_pd1)" stroke-width="3"/>
      <line x1="265" y1="223" x2="290" y2="252" stroke="url(#blue_pd1)" stroke-width="3"/>
      <line x1="235" y1="223" x2="210" y2="252" stroke="url(#blue_pd1)" stroke-width="3"/>
      <line x1="225" y1="193" x2="192" y2="180" stroke="url(#blue_pd1)" stroke-width="3"/>
      <!-- Speed Motion Streaks -->
      <path d="M120 140 C140 100 200 80 250 80" fill="none" stroke="url(#gold_pd1)" stroke-width="6" stroke-linecap="round"/>
      <path d="M380 270 C360 310 300 330 250 330" fill="none" stroke="url(#cyan_pd1)" stroke-width="6" stroke-linecap="round"/>
    </g>
  
  <g transform="translate(250, 440)">
    <path d="M-170 -18 L170 -18 L155 18 L-155 18 Z" fill="url(#blue_pd1)" filter="url(#sh_pd1)"/>
    <rect x="-150" y="-14" width="300" height="28" rx="6" fill="none" stroke="url(#gold_pd1)" stroke-width="1.5"/>
    <text x="0" y="5" fill="#FFFFFF" font-family="sans-serif" font-size="12" font-weight="800" letter-spacing="1.5" text-anchor="middle">SPORTS &amp; ATHLETICS</text>
  </g>
</svg>