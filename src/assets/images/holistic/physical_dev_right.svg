<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="100%" height="100%">
  <defs>
    <linearGradient id="bg_pd2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="100%" stop-color="#F0F6FE"/>
    </linearGradient>
    <linearGradient id="blue_pd2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0B43BD"/>
      <stop offset="100%" stop-color="#061D52"/>
    </linearGradient>
    <linearGradient id="gold_pd2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FCD34D"/>
      <stop offset="50%" stop-color="#D4AF37"/>
      <stop offset="100%" stop-color="#B45309"/>
    </linearGradient>
    <linearGradient id="cyan_pd2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8"/>
      <stop offset="100%" stop-color="#0284C7"/>
    </linearGradient>
    <filter id="sh_pd2" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#0B43BD" flood-opacity="0.16"/>
    </filter>
  </defs>
  <rect width="500" height="500" rx="36" fill="url(#bg_pd2)" stroke="rgba(11,67,189,0.08)" stroke-width="2"/>
  <circle cx="250" cy="210" r="165" fill="none" stroke="url(#gold_pd2)" stroke-width="2.5" stroke-dasharray="8 6" opacity="0.45"/>
  <circle cx="250" cy="210" r="145" fill="none" stroke="url(#blue_pd2)" stroke-width="1.5" opacity="0.25"/>
  
    <g filter="url(#sh_pd2)">
      <!-- Gold Championship Cup -->
      <path d="M190 110 L310 110 L295 200 C295 240 265 260 250 260 C235 260 205 240 205 200 Z" fill="url(#gold_pd2)"/>
      <!-- Cup Handles -->
      <path d="M190 125 C145 130 145 190 195 195" fill="none" stroke="url(#gold_pd2)" stroke-width="10" stroke-linecap="round"/>
      <path d="M310 125 C355 130 355 190 305 195" fill="none" stroke="url(#gold_pd2)" stroke-width="10" stroke-linecap="round"/>
      <!-- Cup Stem & Base -->
      <rect x="238" y="260" width="24" height="35" fill="url(#gold_pd2)"/>
      <rect x="200" y="295" width="100" height="25" rx="6" fill="url(#blue_pd2)"/>
      <!-- Star on Cup -->
      <polygon points="250,150 255,165 270,165 258,174 262,189 250,180 238,189 242,174 230,165 245,165" fill="#FFFFFF"/>
      <text x="250" y="312" fill="#FFFFFF" font-family="sans-serif" font-size="12" font-weight="900" text-anchor="middle">#1 CHAMPION</text>
    </g>
  
  <g transform="translate(250, 440)">
    <path d="M-170 -18 L170 -18 L155 18 L-155 18 Z" fill="url(#blue_pd2)" filter="url(#sh_pd2)"/>
    <rect x="-150" y="-14" width="300" height="28" rx="6" fill="none" stroke="url(#gold_pd2)" stroke-width="1.5"/>
    <text x="0" y="5" fill="#FFFFFF" font-family="sans-serif" font-size="12" font-weight="800" letter-spacing="1.5" text-anchor="middle">FITNESS &amp; CHAMPIONSHIP</text>
  </g>
</svg>