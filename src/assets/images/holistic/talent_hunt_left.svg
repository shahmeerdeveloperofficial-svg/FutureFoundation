<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="100%" height="100%">
  <defs>
    <linearGradient id="bg_th1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="100%" stop-color="#F0F6FE"/>
    </linearGradient>
    <linearGradient id="blue_th1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0B43BD"/>
      <stop offset="100%" stop-color="#061D52"/>
    </linearGradient>
    <linearGradient id="gold_th1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FCD34D"/>
      <stop offset="50%" stop-color="#D4AF37"/>
      <stop offset="100%" stop-color="#B45309"/>
    </linearGradient>
    <linearGradient id="cyan_th1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8"/>
      <stop offset="100%" stop-color="#0284C7"/>
    </linearGradient>
    <filter id="sh_th1" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#0B43BD" flood-opacity="0.16"/>
    </filter>
  </defs>
  <rect width="500" height="500" rx="36" fill="url(#bg_th1)" stroke="rgba(11,67,189,0.08)" stroke-width="2"/>
  <circle cx="250" cy="210" r="165" fill="none" stroke="url(#gold_th1)" stroke-width="2.5" stroke-dasharray="8 6" opacity="0.45"/>
  <circle cx="250" cy="210" r="145" fill="none" stroke="url(#blue_th1)" stroke-width="1.5" opacity="0.25"/>
  
    <g filter="url(#sh_th1)">
      <!-- Brain Core -->
      <circle cx="250" cy="200" r="80" fill="url(#blue_th1)"/>
      <!-- Glowing Knowledge Nodes -->
      <g stroke="url(#gold_th1)" stroke-width="3">
        <line x1="250" y1="200" x2="160" y2="140"/>
        <line x1="250" y1="200" x2="340" y2="140"/>
        <line x1="250" y1="200" x2="140" y2="230"/>
        <line x1="250" y1="200" x2="360" y2="230"/>
        <line x1="250" y1="200" x2="200" y2="290"/>
        <line x1="250" y1="200" x2="300" y2="290"/>
      </g>
      <!-- Node Circles with Icons -->
      <!-- Math / Logic -->
      <circle cx="160" cy="140" r="24" fill="url(#cyan_th1)"/>
      <text x="160" y="146" fill="#FFF" font-family="sans-serif" font-size="14" font-weight="900" text-anchor="middle">&sum;</text>
      <!-- Arts / Music -->
      <circle cx="340" cy="140" r="24" fill="url(#gold_th1)"/>
      <text x="340" y="147" fill="#061D52" font-family="sans-serif" font-size="16" font-weight="900" text-anchor="middle">&#9835;</text>
      <!-- Linguistic -->
      <circle cx="140" cy="230" r="24" fill="url(#gold_th1)"/>
      <text x="140" y="237" fill="#061D52" font-family="sans-serif" font-size="14" font-weight="900" text-anchor="middle">ABC</text>
      <!-- Science / Spatial -->
      <circle cx="360" cy="230" r="24" fill="url(#cyan_th1)"/>
      <text x="360" y="236" fill="#FFF" font-family="sans-serif" font-size="15" font-weight="900" text-anchor="middle">&infin;</text>
      <!-- Interpersonal -->
      <circle cx="200" cy="290" r="22" fill="url(#blue_th1)"/>
      <text x="200" y="296" fill="#FFF" font-family="sans-serif" font-size="13" font-weight="900" text-anchor="middle">&#9786;</text>
      <!-- Kinesthetic -->
      <circle cx="300" cy="290" r="22" fill="url(#blue_th1)"/>
      <text x="300" y="296" fill="url(#gold_th1)" font-family="sans-serif" font-size="14" font-weight="900" text-anchor="middle">&#9733;</text>
      <!-- Center Light Bulb -->
      <circle cx="250" cy="200" r="32" fill="#FFFFFF"/>
      <path d="M240 200 C240 185 260 185 260 200 C260 208 255 212 255 218 L245 218 C245 212 240 208 240 200 Z" fill="url(#gold_th1)"/>
      <rect x="246" y="220" width="8" height="4" fill="#061D52"/>
    </g>
  
  <g transform="translate(250, 440)">
    <path d="M-170 -18 L170 -18 L155 18 L-155 18 Z" fill="url(#blue_th1)" filter="url(#sh_th1)"/>
    <rect x="-150" y="-14" width="300" height="28" rx="6" fill="none" stroke="url(#gold_th1)" stroke-width="1.5"/>
    <text x="0" y="5" fill="#FFFFFF" font-family="sans-serif" font-size="12" font-weight="800" letter-spacing="1.5" text-anchor="middle">MULTIPLE INTELLIGENCES</text>
  </g>
</svg>