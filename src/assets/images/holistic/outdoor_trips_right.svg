<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="100%" height="100%">
  <defs>
    <linearGradient id="bg_ot2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="100%" stop-color="#F0F6FE"/>
    </linearGradient>
    <linearGradient id="blue_ot2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0B43BD"/>
      <stop offset="100%" stop-color="#061D52"/>
    </linearGradient>
    <linearGradient id="gold_ot2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FCD34D"/>
      <stop offset="50%" stop-color="#D4AF37"/>
      <stop offset="100%" stop-color="#B45309"/>
    </linearGradient>
    <linearGradient id="cyan_ot2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8"/>
      <stop offset="100%" stop-color="#0284C7"/>
    </linearGradient>
    <filter id="sh_ot2" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#0B43BD" flood-opacity="0.16"/>
    </filter>
  </defs>
  <rect width="500" height="500" rx="36" fill="url(#bg_ot2)" stroke="rgba(11,67,189,0.08)" stroke-width="2"/>
  <circle cx="250" cy="210" r="165" fill="none" stroke="url(#gold_ot2)" stroke-width="2.5" stroke-dasharray="8 6" opacity="0.45"/>
  <circle cx="250" cy="210" r="145" fill="none" stroke="url(#blue_ot2)" stroke-width="1.5" opacity="0.25"/>
  
    <g filter="url(#sh_ot2)">
      <!-- Adventure Backpack / Unity -->
      <rect x="175" y="130" width="150" height="170" rx="28" fill="url(#blue_ot2)"/>
      <!-- Front Pocket -->
      <rect x="195" y="195" width="110" height="85" rx="16" fill="url(#cyan_ot2)"/>
      <line x1="205" y1="215" x2="295" y2="215" stroke="#FFFFFF" stroke-width="3"/>
      <!-- Straps & Buckles -->
      <rect x="205" y="130" width="18" height="150" fill="url(#gold_ot2)"/>
      <rect x="277" y="130" width="18" height="150" fill="url(#gold_ot2)"/>
      <!-- Top Handle -->
      <path d="M220 130 C220 95 280 95 280 130" fill="none" stroke="url(#blue_ot2)" stroke-width="12" stroke-linecap="round"/>
      <!-- Map Scroll -->
      <g transform="translate(145, 180) rotate(-20)">
        <rect x="0" y="0" width="40" height="90" rx="8" fill="url(#gold_ot2)"/>
        <line x1="6" y1="15" x2="34" y2="15" stroke="#FFF" stroke-width="2"/>
        <line x1="6" y1="30" x2="34" y2="30" stroke="#FFF" stroke-width="2"/>
      </g>
      <!-- Water Bottle -->
      <g transform="translate(320, 175) rotate(15)">
        <rect x="0" y="20" width="35" height="75" rx="10" fill="url(#cyan_ot2)"/>
        <rect x="7" y="5" width="21" height="15" rx="4" fill="url(#gold_ot2)"/>
      </g>
    </g>
  
  <g transform="translate(250, 440)">
    <path d="M-170 -18 L170 -18 L155 18 L-155 18 Z" fill="url(#blue_ot2)" filter="url(#sh_ot2)"/>
    <rect x="-150" y="-14" width="300" height="28" rx="6" fill="none" stroke="url(#gold_ot2)" stroke-width="1.5"/>
    <text x="0" y="5" fill="#FFFFFF" font-family="sans-serif" font-size="12" font-weight="800" letter-spacing="1.5" text-anchor="middle">EXPERIENTIAL LEARNING</text>
  </g>
</svg>