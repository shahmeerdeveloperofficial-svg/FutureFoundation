<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="100%" height="100%">
  <defs>
    <linearGradient id="bg_dc1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="100%" stop-color="#F0F6FE"/>
    </linearGradient>
    <linearGradient id="blue_dc1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0B43BD"/>
      <stop offset="100%" stop-color="#061D52"/>
    </linearGradient>
    <linearGradient id="gold_dc1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FCD34D"/>
      <stop offset="50%" stop-color="#D4AF37"/>
      <stop offset="100%" stop-color="#B45309"/>
    </linearGradient>
    <linearGradient id="cyan_dc1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8"/>
      <stop offset="100%" stop-color="#0284C7"/>
    </linearGradient>
    <filter id="sh_dc1" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#0B43BD" flood-opacity="0.16"/>
    </filter>
  </defs>
  <rect width="500" height="500" rx="36" fill="url(#bg_dc1)" stroke="rgba(11,67,189,0.08)" stroke-width="2"/>
  <circle cx="250" cy="210" r="165" fill="none" stroke="url(#gold_dc1)" stroke-width="2.5" stroke-dasharray="8 6" opacity="0.45"/>
  <circle cx="250" cy="210" r="145" fill="none" stroke="url(#blue_dc1)" stroke-width="1.5" opacity="0.25"/>
  
    <g filter="url(#sh_dc1)">
      <!-- Blazer / Uniform Outline -->
      <path d="M160 110 L250 160 L340 110 L360 300 L140 300 Z" fill="url(#blue_dc1)"/>
      <!-- Inner Shirt & Striped Collar -->
      <polygon points="210,110 250,170 290,110" fill="#FFFFFF"/>
      <!-- Tie -->
      <polygon points="245,160 255,160 258,230 250,245 242,230" fill="url(#gold_dc1)"/>
      <!-- Striped Ribbons on Pocket -->
      <rect x="175" y="210" width="55" height="50" rx="6" fill="#061D52" stroke="url(#gold_dc1)" stroke-width="2"/>
      <line x1="180" y1="225" x2="225" y2="225" stroke="#FFFFFF" stroke-width="3"/>
      <line x1="180" y1="235" x2="225" y2="235" stroke="url(#cyan_dc1)" stroke-width="3"/>
      <line x1="180" y1="245" x2="225" y2="245" stroke="url(#gold_dc1)" stroke-width="3"/>
      <!-- School Crest Crest -->
      <circle cx="202" cy="180" r="16" fill="url(#gold_dc1)"/>
      <polygon points="202,168 206,176 215,176 208,182 211,190 202,185 193,190 196,182 189,176 198,176" fill="#FFFFFF"/>
      <!-- Golden Buttons -->
      <circle cx="250" cy="210" r="5" fill="url(#gold_dc1)"/>
      <circle cx="250" cy="245" r="5" fill="url(#gold_dc1)"/>
      <circle cx="250" cy="280" r="5" fill="url(#gold_dc1)"/>
    </g>
  
  <g transform="translate(250, 440)">
    <path d="M-170 -18 L170 -18 L155 18 L-155 18 Z" fill="url(#blue_dc1)" filter="url(#sh_dc1)"/>
    <rect x="-150" y="-14" width="300" height="28" rx="6" fill="none" stroke="url(#gold_dc1)" stroke-width="1.5"/>
    <text x="0" y="5" fill="#FFFFFF" font-family="sans-serif" font-size="12" font-weight="800" letter-spacing="1.5" text-anchor="middle">SCHOOL UNIFORM &amp; PRIDE</text>
  </g>
</svg>