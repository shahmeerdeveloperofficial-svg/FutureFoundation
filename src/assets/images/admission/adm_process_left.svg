<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="100%" height="100%">
  <defs>
    <linearGradient id="bg_adm1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="100%" stop-color="#F0F6FE"/>
    </linearGradient>
    <linearGradient id="blue_adm1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0B43BD"/>
      <stop offset="100%" stop-color="#061D52"/>
    </linearGradient>
    <linearGradient id="gold_adm1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FCD34D"/>
      <stop offset="50%" stop-color="#D4AF37"/>
      <stop offset="100%" stop-color="#B45309"/>
    </linearGradient>
    <linearGradient id="cyan_adm1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8"/>
      <stop offset="100%" stop-color="#0284C7"/>
    </linearGradient>
    <filter id="sh_adm1" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#0B43BD" flood-opacity="0.16"/>
    </filter>
  </defs>
  <rect width="500" height="500" rx="36" fill="url(#bg_adm1)" stroke="rgba(11,67,189,0.08)" stroke-width="2"/>
  <circle cx="250" cy="210" r="165" fill="none" stroke="url(#gold_adm1)" stroke-width="2.5" stroke-dasharray="8 6" opacity="0.45"/>
  <circle cx="250" cy="210" r="145" fill="none" stroke="url(#blue_adm1)" stroke-width="1.5" opacity="0.25"/>
  
    <g filter="url(#sh_adm1)">
      <!-- Clipboard Base -->
      <rect x="145" y="90" width="210" height="250" rx="16" fill="#FFFFFF" stroke="url(#blue_adm1)" stroke-width="4"/>
      <!-- Clip Top -->
      <rect x="200" y="72" width="100" height="32" rx="8" fill="url(#gold_adm1)"/>
      <circle cx="250" cy="88" r="7" fill="#FFFFFF"/>
      <!-- Form Lines -->
      <rect x="175" y="130" width="100" height="12" rx="6" fill="url(#blue_adm1)"/>
      <rect x="175" y="160" width="150" height="8" rx="4" fill="#E2E8F0"/>
      <rect x="175" y="185" width="150" height="8" rx="4" fill="#E2E8F0"/>
      <rect x="175" y="210" width="120" height="8" rx="4" fill="#E2E8F0"/>
      <!-- Checkmarks -->
      <circle cx="305" cy="164" r="10" fill="url(#cyan_adm1)"/>
      <path d="M300 164 L304 168 L311 160" stroke="#FFF" stroke-width="2.5" fill="none" stroke-linecap="round"/>
      <circle cx="305" cy="189" r="10" fill="url(#cyan_adm1)"/>
      <path d="M300 189 L304 193 L311 185" stroke="#FFF" stroke-width="2.5" fill="none" stroke-linecap="round"/>
      <!-- Stamp Badge -->
      <circle cx="290" cy="275" r="38" fill="url(#gold_adm1)"/>
      <circle cx="290" cy="275" r="32" fill="none" stroke="#FFFFFF" stroke-width="2" stroke-dasharray="4 3"/>
      <text x="290" y="272" fill="#FFFFFF" font-family="sans-serif" font-size="9" font-weight="900" text-anchor="middle">VERIFIED</text>
      <text x="290" y="284" fill="#061D52" font-family="sans-serif" font-size="8" font-weight="800" text-anchor="middle">&#9733;&#9733;&#9733;</text>
      <!-- Pen -->
      <g transform="translate(180, 260) rotate(-35)">
        <rect x="0" y="0" width="14" height="75" rx="3" fill="url(#blue_adm1)"/>
        <polygon points="0,75 14,75 7,95" fill="url(#gold_adm1)"/>
        <circle cx="7" cy="95" r="2" fill="#061D52"/>
      </g>
    </g>
  
  <g transform="translate(250, 440)">
    <path d="M-170 -18 L170 -18 L155 18 L-155 18 Z" fill="url(#blue_adm1)" filter="url(#sh_adm1)"/>
    <rect x="-150" y="-14" width="300" height="28" rx="6" fill="none" stroke="url(#gold_adm1)" stroke-width="1.5"/>
    <text x="0" y="5" fill="#FFFFFF" font-family="sans-serif" font-size="12" font-weight="800" letter-spacing="1.5" text-anchor="middle">ADMISSION &amp; ENROLLMENT</text>
  </g>
</svg>