<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="100%" height="100%">
  <defs>
    <linearGradient id="bg_sf2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="100%" stop-color="#F0F6FE"/>
    </linearGradient>
    <linearGradient id="blue_sf2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0B43BD"/>
      <stop offset="100%" stop-color="#061D52"/>
    </linearGradient>
    <linearGradient id="gold_sf2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FCD34D"/>
      <stop offset="50%" stop-color="#D4AF37"/>
      <stop offset="100%" stop-color="#B45309"/>
    </linearGradient>
    <linearGradient id="cyan_sf2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8"/>
      <stop offset="100%" stop-color="#0284C7"/>
    </linearGradient>
    <filter id="sh_sf2" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#0B43BD" flood-opacity="0.16"/>
    </filter>
  </defs>
  <rect width="500" height="500" rx="36" fill="url(#bg_sf2)" stroke="rgba(11,67,189,0.08)" stroke-width="2"/>
  <circle cx="250" cy="210" r="165" fill="none" stroke="url(#gold_sf2)" stroke-width="2.5" stroke-dasharray="8 6" opacity="0.45"/>
  <circle cx="250" cy="210" r="145" fill="none" stroke="url(#blue_sf2)" stroke-width="1.5" opacity="0.25"/>
  
    <g filter="url(#sh_sf2)">
      <!-- Professional Development Shield / Laurel -->
      <circle cx="250" cy="195" r="90" fill="url(#blue_sf2)"/>
      <circle cx="250" cy="195" r="75" fill="#FFFFFF"/>
      <!-- Growth Staircase / Chart -->
      <rect x="205" y="210" width="22" height="30" rx="3" fill="url(#cyan_sf2)"/>
      <rect x="238" y="180" width="22" height="60" rx="3" fill="url(#blue_sf2)"/>
      <rect x="271" y="150" width="22" height="90" rx="3" fill="url(#gold_sf2)"/>
      <!-- Upward Arrow -->
      <line x1="200" y1="210" x2="285" y2="125" stroke="url(#gold_sf2)" stroke-width="5" stroke-linecap="round"/>
      <polygon points="285,125 265,125 285,145" fill="url(#gold_sf2)"/>
      <!-- Star on Top -->
      <polygon points="250,85 255,98 268,98 258,106 262,118 250,111 238,118 242,106 232,98 245,98" fill="url(#gold_sf2)"/>
    </g>
  
  <g transform="translate(250, 440)">
    <path d="M-170 -18 L170 -18 L155 18 L-155 18 Z" fill="url(#blue_sf2)" filter="url(#sh_sf2)"/>
    <rect x="-150" y="-14" width="300" height="28" rx="6" fill="none" stroke="url(#gold_sf2)" stroke-width="1.5"/>
    <text x="0" y="5" fill="#FFFFFF" font-family="sans-serif" font-size="12" font-weight="800" letter-spacing="1.5" text-anchor="middle">STAFF &amp; RECREATION</text>
  </g>
</svg>