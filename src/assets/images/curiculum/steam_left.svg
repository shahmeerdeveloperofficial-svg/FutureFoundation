    <path d="M205 280 L295 280 L310 305 Q315 312 300 312 L200 312 Q185 312 190 305 Z" fill="url(#cyanStm)"/>
    <rect x="230" y="145" width="40" height="10" rx="4" fill="url(#goldStm)"/>
