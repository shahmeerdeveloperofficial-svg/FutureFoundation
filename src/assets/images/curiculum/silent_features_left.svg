<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="100%" height="100%">
  <defs>
    <linearGradient id="bg_sf1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="100%" stop-color="#F0F6FE"/>
    </linearGradient>
    <linearGradient id="blue_sf1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0B43BD"/>
      <stop offset="100%" stop-color="#061D52"/>
    </linearGradient>
    <linearGradient id="gold_sf1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FCD34D"/>
      <stop offset="50%" stop-color="#D4AF37"/>
      <stop offset="100%" stop-color="#B45309"/>
    </linearGradient>
    <linearGradient id="cyan_sf1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8"/>
      <stop offset="100%" stop-color="#0284C7"/>
    </linearGradient>
    <filter id="sh_sf1" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#0B43BD" flood-opacity="0.16"/>
    </filter>
  </defs>
  <rect width="500" height="500" rx="36" fill="url(#bg_sf1)" stroke="rgba(11,67,189,0.08)" stroke-width="2"/>
  <circle cx="250" cy="210" r="165" fill="none" stroke="url(#gold_sf1)" stroke-width="2.5" stroke-dasharray="8 6" opacity="0.45"/>
  <circle cx="250" cy="210" r="145" fill="none" stroke="url(#blue_sf1)" stroke-width="1.5" opacity="0.25"/>
  
    <g filter="url(#sh_sf1)">
      <!-- Open Parchment / Book -->
      <path d="M150 140 C200 130 240 145 250 155 C260 145 300 130 350 140 L350 280 C300 270 260 285 250 295 C240 285 200 270 150 280 Z" fill="#FFFFFF" stroke="url(#blue_sf1)" stroke-width="4"/>
      <!-- Calligraphy Flourish -->
      <path d="M175 190 C210 160 230 220 250 180" fill="none" stroke="url(#blue_sf1)" stroke-width="4" stroke-linecap="round"/>
      <path d="M260 190 C290 160 310 230 330 180" fill="none" stroke="url(#blue_sf1)" stroke-width="4" stroke-linecap="round"/>
      <!-- Speech Bubble (Spoken English) -->
      <circle cx="210" cy="115" r="30" fill="url(#cyan_sf1)"/>
      <polygon points="215,140 230,155 235,138" fill="url(#cyan_sf1)"/>
      <text x="210" y="122" fill="#FFFFFF" font-family="sans-serif" font-size="14" font-weight="900" text-anchor="middle">EN</text>
      <!-- Traditional Qalam / Pen -->
      <g transform="translate(290, 110) rotate(30)">
        <polygon points="0,0 12,0 8,80 4,80" fill="url(#gold_sf1)"/>
        <polygon points="4,80 8,80 6,95" fill="#061D52"/>
      </g>
    </g>
  
  <g transform="translate(250, 440)">
    <path d="M-170 -18 L170 -18 L155 18 L-155 18 Z" fill="url(#blue_sf1)" filter="url(#sh_sf1)"/>
    <rect x="-150" y="-14" width="300" height="28" rx="6" fill="none" stroke="url(#gold_sf1)" stroke-width="1.5"/>
    <text x="0" y="5" fill="#FFFFFF" font-family="sans-serif" font-size="12" font-weight="800" letter-spacing="1.5" text-anchor="middle">SPOKEN &amp; CALLIGRAPHY</text>
  </g>
</svg>